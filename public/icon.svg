<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="viGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#B80000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for standard icon -->
  <rect width="512" height="512" rx="104" fill="url(#viGrad)" />
  
  <!-- Subtle decorative SIM card chip accent in background -->
  <rect x="330" y="80" width="100" height="120" rx="16" fill="rgba(255,255,255,0.08)" />
  <path d="M400 80 L430 110 L430 200 L330 200 L330 80 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Group with shadow -->
  <g filter="url(#shadow)" transform="translate(4, 0)">
    <!-- Letter 'V' -->
    <path d="M120 180 L185 350 L245 180 L195 180 L185 220 L168 180 Z" fill="#FFFFFF" />
    <path d="M110 185 L182 355 C184 360 190 360 193 355 L265 185 L218 185 L188 285 L157 185 Z" fill="#FFFFFF" />
    
    <!-- Letter 'i' stem -->
    <rect x="280" y="240" width="46" height="115" rx="10" fill="#FFFFFF" />
    
    <!-- Dot of 'i' (iconic Vi golden-yellow dot) -->
    <circle cx="303" cy="195" r="26" fill="#FFC800" />
  </g>
  
  <!-- Subtitle badge: MNP -->
  <rect x="156" y="390" width="200" height="42" rx="21" fill="rgba(0,0,0,0.22)" />
  <text x="256" y="418" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="4">SALES MNP</text>
</svg>
