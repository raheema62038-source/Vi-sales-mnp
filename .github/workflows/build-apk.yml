name: Build Android APK (Vi Sales MNP)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web App & Sync Capacitor
        run: npm run build:android

      - name: Setup Android Release Keystore (Persistent GitHub Secret)
        id: setup_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Persistent Release Keystore detected in secrets. Decoding..."
            mkdir -p $HOME/android-signing
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $HOME/android-signing/release-key.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$HOME/android-signing/release-key.jks" >> $GITHUB_ENV
            echo "Keystore successfully prepared."
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "No persistent keystore found in secrets. Will build debug/unsigned fallback."
          fi

      - name: Build Android Release APK (Signed via Keystore)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building fallback APK (assembleDebug)..."
            ./gradlew assembleDebug
          fi

      - name: Prepare Final Output APKs
        run: |
          mkdir -p final-apk
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Found signed release APK."
            cp android/app/build/outputs/apk/release/app-release.apk final-apk/app-release.apk
            # Keep app-debug.apk filename copy for backward-compatible URL link if existing installations use it
            cp android/app/build/outputs/apk/release/app-release.apk final-apk/app-debug.apk
            echo "APK_TYPE=release" >> $GITHUB_ENV
          else
            echo "Using debug APK as fallback."
            cp android/app/build/outputs/apk/debug/app-debug.apk final-apk/app-release.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk final-apk/app-debug.apk
            echo "APK_TYPE=debug" >> $GITHUB_ENV
          fi
          ls -lh final-apk/

      - name: Upload Vi Sales MNP APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vi-Sales-MNP-Release-APK
          path: final-apk/*
          if-no-files-found: error

      - name: Create or Update GitHub Release & Upload Signed APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1' }}"
          RELEASE_TITLE="Vi Sales MNP APK v1.1 (Signed Release)"
          
          echo "Target Tag: $TAG_NAME"

          # 1. Ensure git tag exists
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi

          RELEASE_NOTES="### Vi Sales MNP Android APK
- **Application / Package ID:** \`com.vi.salesmnp\`
- **Version Name:** 1.1
- **Version Code:** 2
- **Build Type:** Signed Release APK
- **Direct Download (Release APK):** [\`app-release.apk\`](https://github.com/raheema62038/vi-sales-mnp/releases/latest/download/app-release.apk)
- **Direct Download (Compatibility):** [\`app-debug.apk\`](https://github.com/raheema62038/vi-sales-mnp/releases/latest/download/app-debug.apk)"

          # 2. Check if release already exists using GitHub CLI
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading signed APK assets..."
            gh release upload "$TAG_NAME" final-apk/app-release.apk final-apk/app-debug.apk --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            echo "Release $TAG_NAME does not exist. Creating new release..."
            gh release create "$TAG_NAME" final-apk/app-release.apk final-apk/app-debug.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          echo "GitHub Release successfully created/updated with signed release APK!"


