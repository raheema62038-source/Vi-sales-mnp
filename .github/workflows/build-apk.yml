name: Build Android APK (Vi Sales MNP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web App & Sync Capacitor
        run: npm run build:android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Vi Sales MNP APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vi-Sales-MNP-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (v1.1 / latest)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Vi Sales MNP APK v1.1
          body: |
            ### Vi Sales MNP Android APK
            - **Application / Package ID:** `com.vi.salesmnp`
            - **Version Name:** `1.1`
            - **Version Code:** `2`
            - **Download:** Download `app-debug.apk` directly to your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
