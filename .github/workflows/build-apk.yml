name: Build Android APK (Vi Sales MNP)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web App & Sync Capacitor
        run: npm run build:android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Verify APK Output Exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build verified successfully!"

      - name: Upload Vi Sales MNP APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vi-Sales-MNP-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release & Upload APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1' }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TITLE="Vi Sales MNP APK v1.1"
          
          echo "Target Tag: $TAG_NAME"
          echo "Target File: $APK_PATH"

          # 1. If git tag does not exist locally or remotely, tag the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi

          # 2. Check if release already exists using GitHub CLI
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading APK asset and overwriting if existing..."
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "### Vi Sales MNP Android APK
- **Application ID:** \`com.vi.salesmnp\`
- **Version Name:** 1.1
- **Version Code:** 2
- **Direct Download:** [\`app-debug.apk\`](https://github.com/raheema62038/vi-sales-mnp/releases/latest/download/app-debug.apk)"
          else
            echo "Release $TAG_NAME does not exist. Creating new release..."
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "$RELEASE_TITLE" \
              --notes "### Vi Sales MNP Android APK
- **Application ID:** \`com.vi.salesmnp\`
- **Version Name:** 1.1
- **Version Code:** 2
- **Direct Download:** [\`app-debug.apk\`](https://github.com/raheema62038/vi-sales-mnp/releases/latest/download/app-debug.apk)"
          fi

          echo "GitHub Release successfully created/updated with app-debug.apk!"

